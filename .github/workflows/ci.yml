name: CI

on: [push, pull_request]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commerce_test
          POSTGRES_PASSWORD: commerce_test_password
          POSTGRES_DB: commerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce_test -d commerce_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      COMMERCE_FINANCE_TEST_DATABASE_URL: postgres://commerce_test:commerce_test_password@127.0.0.1:5432/commerce_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated JetStream test broker
        run: |
          docker run -d --name ci-nats -p 127.0.0.1:4222:4222 nats:2.11-alpine -js
          echo "EVENTBUS_TEST_NATS_URL=nats://127.0.0.1:4222" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: test -z "$(gofmt -d cmd internal)"
      - run: go test ./... -count=1
      - run: go vet ./...

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mightyfin/commerce-finance-service:main
